<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Getting to Know You</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff0f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #e75480;
            text-align: center;
        }

        button {
            background: #e75480;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #d6336c;
        }

        input, textarea {
            width: 95%;
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>

<body>

<div class="container">
   <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdQ_u9atw2VT26PN8g0kBuef_OhJ6Ga-9xF8g34H5WOkOokCQ/viewform?embedded=true" width="640" height="574" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
</div>

<script>
    document.getElementById("questionnaire")
        .addEventListener("submit", function(event) {
            event.preventDefault();
            document.getElementById("result").textContent =
                "Thank you for answering! ❤️";
        });
</script>

</body>
</html>
