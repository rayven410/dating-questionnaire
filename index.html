<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Getting to Know You</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff0f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #e75480;
            text-align: center;
        }

        button {
            background: #e75480;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #d6336c;
        }

        input, textarea {
            width: 95%;
            padding: 10px;
            margin: 10px 0;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Getting to Know You</h1>
    <p>Let's get to know each other a little better!</p>

    <form id="questionnaire">

        <label>What should I call you?</label>
        <input type="text" name="name" required>

        <label>What's your favourite hobby?</label>
        <input type="text" name="hobby">

        <label>What's your ideal date?</label>
        <textarea name="ideal_date"></textarea>

        <label>What's your love language?</label>
        <select name="love_language">
            <option>Words of Affirmation</option>
            <option>Quality Time</option>
            <option>Receiving Gifts</option>
            <option>Acts of Service</option>
            <option>Physical Touch</option>
        </select>

        <br><br>
        <button type="submit">Submit</button>

    </form>

    <p id="result"></p>
</div>

<script>
    document.getElementById("questionnaire")
        .addEventListener("submit", function(event) {
            event.preventDefault();
            document.getElementById("result").textContent =
                "Thank you for answering! ❤️";
        });
</script>

</body>
</html>
